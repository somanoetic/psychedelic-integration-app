name: CI - Validate & Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  NODE_VERSION: '18'

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          echo "Validating app.config.js (syntax only — it's a dynamic ESM config that pulls in expo/dotenv at eval time)..."
          node --check app.config.js
          echo "Validating eas.json..."
          node -e "require('./eas.json')"

      - name: Check for secrets
        run: |
          echo "Scanning for exposed secrets..."
          if grep -r "sk-ant-" . --include="*.js" --include="*.json" --exclude-dir=node_modules 2>/dev/null; then
            echo "ERROR: Anthropic API key found in source code!"
            exit 1
          fi
          echo "No secrets detected"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
